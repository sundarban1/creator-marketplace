name: Backend keep-alive

# Hits the deployed backend's /health endpoint every 10 minutes as a
# lightweight uptime check — the run fails (and notifies) if the API or its
# database connectivity is down. The instance is always-on (paid), so this
# is monitoring only, not a cold-start keep-warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: |
          curl -fsS --max-time 20 https://kolab-api.onrender.com/health
