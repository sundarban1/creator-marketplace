name: Backend keep-alive

# Pings the deployed backend's /health endpoint every 10 minutes so the
# service is never woken from a cold state during an active chat session —
# a cold backend silently drops in-flight Socket.IO connections, breaking
# typing indicators and real-time message delivery until the client
# reconnects. This is a stopgap only: it does not help once real hosting
# resource/traffic limits are hit.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: |
          curl -fsS --max-time 20 https://marketplace-backend-ofge.onrender.com/health
