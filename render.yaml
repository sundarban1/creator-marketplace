databases:
  # Singapore replacement for the old Oregon `kolab` Postgres. Renamed so a
  # Blueprint sync provisions a fresh instance instead of adopting the Oregon
  # one (Render matches by name and ignores `region` changes on existing
  # resources). Migrate data with pg_dump/pg_restore before cutover, then
  # delete the old `kolab` database from the dashboard.
  - name: kolab-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  # Socket.IO cross-instance broadcast (backend/src/socket.ts's Redis adapter) —
  # required whenever kolab-api runs on more than one instance. Without this, a
  # chat message/typing event from a user whose socket landed on one instance
  # never reaches a user connected to a different instance, since Socket.IO's
  # default adapter only knows about sockets in its own process.
  # ipAllowList: [] = no external access, reachable only from other services in
  # this same Render account/region (matches how DATABASE_URL is wired below).
  # Renamed from the Oregon `kolab-redis` so the sync creates a fresh instance;
  # Redis holds only ephemeral adapter/cache/rate-limit state, nothing to migrate.
  - type: redis
    name: kolab-cache
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    # Singapore replacement for the old Oregon `marketplace-backend`. New name =>
    # new URL https://kolab-api.onrender.com (used in the *_REDIRECT_URI vars
    # below and by the web/mobile clients). Bump `plan` here if this service is
    # later moved to a paid, multi-instance plan on the dashboard.
    name: kolab-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true

    # Run migrations ONCE per deploy, before any new instance starts — instead
    # of every instance racing `prisma migrate deploy` in its own entrypoint on
    # boot (Prisma advisory-locks so that's safe, but it serialises startup and
    # a failed migration can wedge every instance's boot loop). The entrypoint
    # still runs `migrate deploy` too as an idempotent safety net (fast no-op
    # once this has applied everything) and for non-Render environments
    # (docker-compose) that don't have a pre-deploy phase.
    preDeployCommand: npx prisma migrate deploy

    # Skip auto-deploy when a push only touches web/ or mobile/ — without this,
    # every commit anywhere in the monorepo redeploys the backend too.
    buildFilter:
      paths:
        - backend/**
        - render.yaml

    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: LOG_LEVEL
        value: info

      # Per-instance Prisma connection-pool cap — instances × this must stay
      # under the Postgres connection ceiling (raise the DB plan or move to a
      # pooler before raising this). See backend/src/prisma.ts.
      - key: DB_CONNECTION_LIMIT
        value: 5

      # Log any query slower than this (ms) at warn level.
      - key: SLOW_QUERY_LOG_MS
        value: 300

      # Sentry performance tracing — 10% of requests sampled. Cheap at this
      # volume; gives endpoint latency / slow-span data.
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1

      # ── Database — wired to the Render Postgres instance above. After this
      # database's first deploy (migrations run automatically via
      # docker-entrypoint.sh), open the service's Shell tab on the Render
      # dashboard and run:
      #   npm run db:seed:essentials   (categories, legal pages, FAQs, contract template)
      #   npm run db:seed:admin        (SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD env vars)
      #   npm run db:seed:platforms    (platform catalog)
      # `npm run db:seed` also exists but additionally creates fake demo
      # users/campaigns/success-stories — local/staging use only, not prod.
      - key: DATABASE_URL
        fromDatabase:
          name: kolab-db
          property: connectionString

      # ── Redis — backs the Socket.IO cross-instance adapter above ────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: kolab-cache
          property: connectionString

      # ── Auth secrets — Render generates strong random values on first deploy ─
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ── CORS — set to your deployed web app origin(s), comma-separated ─────
      - key: FRONTEND_URL
        sync: false

      # ── Email ───────────────────────────────────────────────────────────────
      # RESEND_API_KEY is the production path and the one that must be set: it
      # sends over HTTPS, so it works regardless of outbound SMTP-port blocking.
      # Requires ourkolab.com to be verified at resend.com/domains, otherwise
      # Resend only delivers to the account owner's own inbox.
      # The EMAIL_*/SMTP_* vars below are the local-dev fallback and are usually
      # pointed at a capture-only sandbox (Mailtrap) — do NOT rely on them here:
      # a sandbox accepts every message and delivers none, which is exactly how
      # prod ended up silently swallowing every signup/reset OTP.
      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        sync: false

      - key: EMAIL_SECURE
        sync: false

      - key: EMAIL_USERNAME
        sync: false

      - key: EMAIL_PASSWORD
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      # ── Cloudinary (avatar/logo/document uploads) — fill in via dashboard ───
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── AI campaign generator — fill in via dashboard ───────────────────────
      - key: OPENAI_API_KEY
        sync: false

      # ── TikTok Login Kit (creator social-account OAuth connect) ─────────────
      - key: TIKTOK_CLIENT_KEY
        sync: false

      - key: TIKTOK_CLIENT_SECRET
        sync: false

      - key: TIKTOK_REDIRECT_URI
        value: https://kolab-api.onrender.com/api/creator/social-accounts/tiktok/callback

      - key: APP_SCHEME
        value: kolab

      # ── Facebook Login (creator social-account connect) ─────────────────────
      # App ID is public and already embedded in the mobile client.
      # Only the secret needs to be supplied through the dashboard.
      - key: FACEBOOK_APP_ID
        value: "1740519673635792"

      - key: FACEBOOK_APP_SECRET
        sync: false

      # ── Instagram API with Instagram Login (direct connect) ────────────────
      - key: INSTAGRAM_APP_ID
        sync: false

      - key: INSTAGRAM_APP_SECRET
        sync: false

      - key: INSTAGRAM_REDIRECT_URI
        value: https://kolab-api.onrender.com/api/creator/social-accounts/instagram-login/callback

      # ── Google OAuth (YouTube connect token refresh) ────────────────────────
      # Client IDs are public and already embedded in the mobile client.
      # Only the Web client's secret needs to be supplied through the dashboard.
      # Android/iOS client IDs have no secret (public/native clients) but ARE
      # required — native refresh tokens are minted under them, not the Web client.
      - key: GOOGLE_WEB_CLIENT_ID
        value: "543768819635-6mhj10fgm73eboahjnhttogaihn068if.apps.googleusercontent.com"

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_ANDROID_CLIENT_ID
        value: "543768819635-at5jjekqobcots66gl7lv0gufh8b6rp3.apps.googleusercontent.com"

      - key: GOOGLE_IOS_CLIENT_ID
        value: "543768819635-fuslrtr8mt6bmi2jslc3h3hcqg4drhdk.apps.googleusercontent.com"

      # ── Sign in with Apple ──────────────────────────────────────────────────
      # APPLE_CLIENT_ID is the iOS bundle id and is the `aud` every Apple
      # identity token is verified against — sign-in returns 503 without it.
      # Not a secret. Add APPLE_TEAM_ID / APPLE_KEY_ID /
      # APPLE_PRIVATE_KEY (.p8 contents) via the dashboard only once token
      # revocation or the server-to-server webhook is turned on.
      - key: APPLE_CLIENT_ID
        value: com.sundarban.kolab

  # marketplace-web — added as a NEW service, deliberately separate from
  # whatever dashboard-managed static site currently serves ourkolab.com.
  #
  # Its static-file fallback was serving dist/index.html (the homepage) for
  # every path without an exact file match, including paths that have their
  # own prerendered page (dist/terms/index.html, etc.) — Google saw that as
  # duplicate/soft-404 content across the site. server.mjs replaces that
  # opaque fallback with explicit routing (see web/server.mjs).
  #
  # This will NOT automatically start serving ourkolab.com — after this
  # deploys and its own <service>.onrender.com URL is verified working,
  # the ourkolab.com/www.ourkolab.com custom domains need to be moved to
  # this service in the Render dashboard, then the old static site retired.
  - type: web
    name: marketplace-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /healthz
    autoDeploy: true

    buildFilter:
      paths:
        - web/**
        - render.yaml