# The Singapore Postgres (`kolab-db`) was created directly on the Render
# dashboard, not by this Blueprint — so it is NOT declared here (a `databases:`
# entry would make a sync provision a second, separate instance). Its connection
# string is wired into DATABASE_URL below. Migrate data with pg_dump/pg_restore
# before cutover, then delete the old Oregon `kolab` database.

services:
  # ── kolab-cache ────────────────────────────────────────────────────────────
  # Best-effort / evictable Redis: Socket.IO cross-instance adapter, the API
  # response cache (utils/cache.ts), rate-limit counters, and the profile-read
  # cache. Every key here has a TTL and every consumer degrades cleanly if the
  # value is gone, so `volatile-lru` is safe — when the 25 MB fills it drops the
  # oldest TTL'd key instead of erroring on writes.
  #
  # Socket.IO adapter needs cross-instance broadcast: without it a chat/typing
  # event from a user on one kolab-api instance never reaches a user on another.
  # ipAllowList: [] = reachable only from other services in this account/region.
  - type: redis
    name: kolab-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: volatile-lru

  # ── kolab-queue ────────────────────────────────────────────────────────────
  # Durable Redis: BullMQ job queues + the notification queue, plus OTP / short-
  # lived session data / counters that must not silently vanish. BullMQ refuses
  # to run against an evicting instance (evicted job keys corrupt a queue), so
  # this one is `noeviction`. Everything written here still sets a TTL; nothing
  # is a source of truth (Postgres remains that for OTP), Redis is the fast path.
  - type: redis
    name: kolab-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    # Singapore replacement for the old Oregon `marketplace-backend`. New name =>
    # new URL https://kolab-api.onrender.com (used in the *_REDIRECT_URI vars
    # below and by the web/mobile clients). Bump `plan` here if this service is
    # later moved to a paid, multi-instance plan on the dashboard.
    name: kolab-api
    runtime: docker
    plan: free
    region: singapore
    # Deploy on every push to master (region migration is now merged).
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true

    # NOTE: `preDeployCommand` is not supported on Render's free tier, so
    # migrations run from docker-entrypoint.sh (`npx prisma migrate deploy`) as
    # each instance boots. Prisma advisory-locks that, so it's safe even with
    # multiple instances, though it serialises startup. If this service is moved
    # to a paid plan, add back:
    #   preDeployCommand: npx prisma migrate deploy
    # to run migrations once per deploy before any new instance starts.

    # Skip auto-deploy when a push only touches web/ or mobile/ — without this,
    # every commit anywhere in the monorepo redeploys the backend too.
    buildFilter:
      paths:
        - backend/**
        - render.yaml

    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: LOG_LEVEL
        value: info

      # Per-instance Prisma connection-pool cap — instances × this must stay
      # under the Postgres connection ceiling (raise the DB plan or move to a
      # pooler before raising this). See backend/src/prisma.ts.
      - key: DB_CONNECTION_LIMIT
        value: 5

      # Log any query slower than this (ms) at warn level.
      - key: SLOW_QUERY_LOG_MS
        value: 300

      # Sentry performance tracing — 10% of requests sampled. Cheap at this
      # volume; gives endpoint latency / slow-span data.
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1

      # Sentry error tracking (see src/instrument.ts). Optional — errors just
      # aren't reported when unset. The backend has its OWN DSN, separate from
      # the web/mobile ones.
      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_ENVIRONMENT
        value: production

      # ── Database — wired to the Render Postgres instance above. After this
      # database's first deploy (migrations run automatically via
      # docker-entrypoint.sh), open the service's Shell tab on the Render
      # dashboard and run:
      #   npm run db:seed:essentials   (categories, legal pages, FAQs, contract template)
      #   npm run db:seed:admin        (SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD env vars)
      #   npm run db:seed:platforms    (platform catalog)
      # `npm run db:seed` also exists but additionally creates fake demo
      # users/campaigns/success-stories — local/staging use only, not prod.
      # Internal connection string for the dashboard-created `kolab-db` Postgres
      # (Singapore). Internal URL — only resolves from services in the same
      # Render region. ⚠️ This embeds the DB password in git history; prefer
      # `sync: false` here and paste the string in the dashboard instead if you
      # can. Rotate this password from the Render dashboard if the repo is ever
      # exposed.
      - key: DATABASE_URL
        value: postgresql://kolab_db_user:2PhydHfBIMRykQ28LcdWWxC7FoAZyZn2@dpg-dac2r48n74is738vc8v0-a/kolab_db

      # ── Redis ──────────────────────────────────────────────────────────────
      # REDIS_URL      → kolab-cache: Socket.IO adapter, response/profile cache,
      #                  rate-limit store. Evictable, best-effort.
      # REDIS_QUEUE_URL → kolab-queue: BullMQ + notification queue + OTP fast
      #                  path + counters. noeviction. Optional — every consumer
      #                  falls back (queue → inline send, OTP → Postgres) if unset.
      - key: REDIS_URL
        fromService:
          type: redis
          name: kolab-cache
          property: connectionString

      - key: REDIS_QUEUE_URL
        fromService:
          type: redis
          name: kolab-queue
          property: connectionString

      # ── Auth secrets — Render generates strong random values on first deploy ─
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ── CORS — set to your deployed web app origin(s), comma-separated ─────
      - key: FRONTEND_URL
        sync: false

      # ── Email ───────────────────────────────────────────────────────────────
      # RESEND_API_KEY is the production path and the one that must be set: it
      # sends over HTTPS, so it works regardless of outbound SMTP-port blocking.
      # Requires ourkolab.com to be verified at resend.com/domains, otherwise
      # Resend only delivers to the account owner's own inbox.
      # The EMAIL_*/SMTP_* vars below are the local-dev fallback and are usually
      # pointed at a capture-only sandbox (Mailtrap) — do NOT rely on them here:
      # a sandbox accepts every message and delivers none, which is exactly how
      # prod ended up silently swallowing every signup/reset OTP.
      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        sync: false

      - key: EMAIL_SECURE
        sync: false

      - key: EMAIL_USERNAME
        sync: false

      - key: EMAIL_PASSWORD
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      # Legacy generic-SMTP fallback (src/utils/email/core.ts) — only used if
      # RESEND_API_KEY and the EMAIL_* Gmail vars are both unset. Optional.
      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      # ── Cloudinary (avatar/logo/document uploads) — fill in via dashboard ───
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Cloudflare R2 — primary store for chat/deliverable video + chat voice
      # recordings (src/services/r2.service.ts, utils/r2Media.ts). All optional:
      # when unset those two flows fall back to the Cloudinary signed-upload path.
      # R2_PUBLIC_URL is the bucket's public base URL and is required for stored
      # media to actually resolve.
      - key: R2_ACCOUNT_ID
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: R2_BUCKET_NAME
        sync: false

      - key: R2_PUBLIC_URL
        sync: false

      - key: R2_PRESIGNED_URL_EXPIRY
        value: "900"

      # ── AI campaign generator — fill in via dashboard ───────────────────────
      - key: OPENAI_API_KEY
        sync: false

      # Unsplash stock-photo search for AI draft feature images (utils/imageSearch.ts).
      # Optional: without it drafts carry no featureImageUrl and the client uses
      # its local category photo map.
      - key: UNSPLASH_ACCESS_KEY
        sync: false

      # ── TikTok Login Kit (creator social-account OAuth connect) ─────────────
      - key: TIKTOK_CLIENT_KEY
        sync: false

      - key: TIKTOK_CLIENT_SECRET
        sync: false

      - key: TIKTOK_REDIRECT_URI
        value: https://kolab-api.onrender.com/api/creator/social-accounts/tiktok/callback

      - key: APP_SCHEME
        value: kolab

      # ── Facebook Login (creator social-account connect) ─────────────────────
      # App ID is public and already embedded in the mobile client.
      # Only the secret needs to be supplied through the dashboard.
      - key: FACEBOOK_APP_ID
        value: "1740519673635792"

      - key: FACEBOOK_APP_SECRET
        sync: false

      # ── Instagram API with Instagram Login (direct connect) ────────────────
      - key: INSTAGRAM_APP_ID
        sync: false

      - key: INSTAGRAM_APP_SECRET
        sync: false

      - key: INSTAGRAM_REDIRECT_URI
        value: https://kolab-api.onrender.com/api/creator/social-accounts/instagram-login/callback

      # ── Google OAuth (YouTube connect token refresh) ────────────────────────
      # Client IDs are public and already embedded in the mobile client.
      # Only the Web client's secret needs to be supplied through the dashboard.
      # Android/iOS client IDs have no secret (public/native clients) but ARE
      # required — native refresh tokens are minted under them, not the Web client.
      - key: GOOGLE_WEB_CLIENT_ID
        value: "543768819635-6mhj10fgm73eboahjnhttogaihn068if.apps.googleusercontent.com"

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_ANDROID_CLIENT_ID
        value: "543768819635-at5jjekqobcots66gl7lv0gufh8b6rp3.apps.googleusercontent.com"

      - key: GOOGLE_IOS_CLIENT_ID
        value: "543768819635-fuslrtr8mt6bmi2jslc3h3hcqg4drhdk.apps.googleusercontent.com"

      # ── Sign in with Apple ──────────────────────────────────────────────────
      # APPLE_CLIENT_ID is the iOS bundle id and is the `aud` every Apple
      # identity token is verified against — sign-in returns 503 without it.
      # Not a secret. Add APPLE_TEAM_ID / APPLE_KEY_ID /
      # APPLE_PRIVATE_KEY (.p8 contents) via the dashboard only once token
      # revocation or the server-to-server webhook is turned on.
      - key: APPLE_CLIENT_ID
        value: com.sundarban.kolab

      # Only needed once Apple token revocation / server-to-server notifications
      # are turned on (not wired up yet). APPLE_PRIVATE_KEY is the .p8 contents
      # with literal \n. All optional.
      - key: APPLE_TEAM_ID
        sync: false

      - key: APPLE_KEY_ID
        sync: false

      - key: APPLE_PRIVATE_KEY
        sync: false

      # ── Khalti ePayment (business pays to start a paid application) ─────────
      # Currently pointed at Khalti's dev/sandbox. The key below is our sandbox
      # merchant's live_secret_key from test-admin.khalti.com (only valid against
      # dev.khalti.com — 401s on production) — for LIVE payments switch this to
      # `sync: false` + the production live secret key, and set KHALTI_BASE_URL
      # to https://khalti.com/api/v2. Sandbox checkout logins: Khalti ID
      # 9800000000-9800000005, MPIN 1111, OTP 987654.
      - key: KHALTI_SECRET_KEY
        value: "e29ab894b88a403eaab73ca3a8f74fec"

      - key: KHALTI_BASE_URL
        value: https://dev.khalti.com/api/v2

      - key: KHALTI_RETURN_URL
        value: https://kolab-api.onrender.com/api/payments/khalti/callback

      # ── eSewa ePay v2 (same role as Khalti above) ──────────────────────────
      # Optional: without ESEWA_SECRET_KEY / ESEWA_RETURN_BASE_URL, selecting
      # eSewa at pay time fails with a clear error. ESEWA_MERCHANT_CODE /
      # ESEWA_BASE_URL / ESEWA_STATUS_URL default to the UAT (rc) endpoints in
      # code — set all three for live payments.
      - key: ESEWA_SECRET_KEY
        sync: false

      - key: ESEWA_MERCHANT_CODE
        sync: false

      - key: ESEWA_BASE_URL
        sync: false

      - key: ESEWA_STATUS_URL
        sync: false

      - key: ESEWA_RETURN_BASE_URL
        value: https://kolab-api.onrender.com

      # ── Sparrow SMS (Nepal) — signup + forgot-password OTP only ────────────
      # Optional: when SPARROW_SMS_TOKEN is unset, sendSms() logs and no-ops and
      # those OTP flows still work (email path). SPARROW_SMS_FROM defaults to
      # "Kolab".
      - key: SPARROW_SMS_TOKEN
        sync: false

      - key: SPARROW_SMS_FROM
        sync: false

      # ── First-run seeding — read by `npm run db:seed:admin` (run once from the
      # service Shell tab after the first deploy, see the DATABASE_URL note above).
      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

  # marketplace-web — added as a NEW service, deliberately separate from
  # whatever dashboard-managed static site currently serves ourkolab.com.
  #
  # Its static-file fallback was serving dist/index.html (the homepage) for
  # every path without an exact file match, including paths that have their
  # own prerendered page (dist/terms/index.html, etc.) — Google saw that as
  # duplicate/soft-404 content across the site. server.mjs replaces that
  # opaque fallback with explicit routing (see web/server.mjs).
  #
  # This will NOT automatically start serving ourkolab.com — after this
  # deploys and its own <service>.onrender.com URL is verified working,
  # the ourkolab.com/www.ourkolab.com custom domains need to be moved to
  # this service in the Render dashboard, then the old static site retired.
  - type: web
    name: marketplace-web
    runtime: docker
    plan: free
    region: singapore
    # Deploy on every push to master.
    branch: master
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /healthz
    autoDeploy: true

    buildFilter:
      paths:
        - web/**
        - render.yaml